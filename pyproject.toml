[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "indra-advanced"
version = "1.0.0"
description = "Lightweight CPU Document Intelligence & Zero-Shot Schema Extraction Pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "onnxruntime>=1.17.0",
    "rapidocr-onnxruntime>=1.3.8",
    "rapid-table>=0.1.0",
    "gliner>=0.2.0",
    "pandas>=2.0.0",
    "beautifulsoup4>=4.12.0",
    "pillow>=10.0.0",
    "opencv-python>=4.8.0",
    "pydantic>=2.5.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.25.0",
    "python-multipart>=0.0.9",
    "pytest>=7.4.0",
]
